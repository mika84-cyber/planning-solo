[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."useful-document-file"]
  included_files = ["public/useful-forms/*.pdf", "public/useful-forms/*.docx"]

[[redirects]]
  from = "/useful-forms/hilma-af-klint.pdf"
  to = "/api/useful-document-file?file=hilma-af-klint.pdf"
  status = 200
  force = true

[[redirects]]
  from = "/useful-forms/demande-conges.pdf"
  to = "/api/useful-document-file?file=demande-conges.pdf"
  status = 200
  force = true

