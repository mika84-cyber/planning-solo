name: Qualité

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-build-security:
    name: Lint, types, tests, couverture, build et budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:ci
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Parcours ordinateur, mobile et Z Fold
    needs: unit-build-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Conserver le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
