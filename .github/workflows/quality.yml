name: Qualité

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-build-security:
    name: Lint, types, tests, couverture, build et budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bloquant dès « high » : ce qui est livré, l'application et les
      # fonctions Netlify (dependencies de package.json).
      - name: Audit des dépendances livrées
        run: npm audit --omit=dev --audit-level=high
      # Outils de construction et de test : bloquant à « critical » seulement.
      # Un avis « high » y devient un avertissement affiché sur l'exécution,
      # pour qu'une faille sans correctif d'un outil n'arrête plus le lint,
      # les tests, le build et les parcours.
      - name: Audit des outils de développement
        run: |
          npm audit --audit-level=high && exit 0
          echo "::warning title=Audit des outils de développement::Un avis de sécurité « high » touche un outil de construction ou de test (détail dans le journal de cette étape)."
          npm audit --audit-level=critical > /dev/null
      - run: npm run check:ci
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Parcours ordinateur, mobile, iPhone et Z Fold
    needs: unit-build-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Conserver le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  pwa:
    name: Application installable (service worker)
    needs: unit-build-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - name: Conserver le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pwa
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
